name: Build & Release CBT Teladan

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Permission untuk semua jobs
permissions:
  contents: write

jobs:
  # =========================================
  # BUILD WINDOWS (.exe installer)
  # =========================================
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Debug - check electron
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "Electron binary:"
          dir node_modules\electron\dist\electron.exe
        shell: cmd

      - name: Create build resources dir
        run: mkdir build 2>nul & echo ok
        shell: cmd

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: List dist output
        if: always()
        shell: powershell
        run: |
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "dist folder does not exist"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-Teladan-Windows
          path: dist/*.exe
          retention-days: 30

  # =========================================
  # BUILD macOS (.dmg installer)
  # =========================================
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Debug - check electron
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Arch: $(uname -m)"
          ls -la node_modules/electron/dist/ | head -5

      - name: Create build resources dir
        run: mkdir -p build

      - name: Build macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --publish never

      - name: List dist output
        if: always()
        run: ls -laR dist/ 2>/dev/null || echo "dist folder does not exist"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-Teladan-macOS
          path: dist/*.dmg
          retention-days: 30

  # =========================================
  # BUAT GITHUB RELEASE
  # =========================================
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download semua artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CBT Teladan ${{ github.ref_name }}"
          body: |
            ## CBT Teladan ${{ github.ref_name }}

            **Aplikasi Ujian Resmi SMA Negeri 1 Yogyakarta**

            ### Download
            - **Windows**: `CBT-Teladan-Setup-x.x.x.exe`
            - **macOS**: `CBT-Teladan-x.x.x.dmg`

            ### Cara Install
            1. Download file sesuai OS
            2. Jalankan installer
            3. Aplikasi akan terbuka otomatis
          draft: false
          prerelease: false
          files: |
            artifacts/CBT-Teladan-Windows/*
            artifacts/CBT-Teladan-macOS/*
