name: Build & Release CBT Teladan

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =========================================
  # BUILD WINDOWS (.exe installer)
  # =========================================
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-Teladan-Windows
          path: dist/*.exe
          retention-days: 30

  # =========================================
  # BUILD macOS (.dmg installer)
  # =========================================
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Build macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-Teladan-macOS
          path: dist/*.dmg
          retention-days: 30

  # =========================================
  # BUILD LINUX (.AppImage & .deb)
  # =========================================
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Install Linux build tools
        run: sudo apt-get install -y rpm fakeroot dpkg

      - name: Build Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-Teladan-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

  # =========================================
  # BUAT GITHUB RELEASE (khusus saat push tag)
  # =========================================
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download semua artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CBT Teladan ${{ github.ref_name }}"
          body: |
            ## CBT Teladan ${{ github.ref_name }}

            **Aplikasi Ujian Resmi SMA Negeri 1 Yogyakarta**

            ### Download
            | Platform | File |
            |----------|------|
            | **Windows** | `CBT-Teladan-Setup-x.x.x.exe` |
            | **macOS** | `CBT-Teladan-x.x.x.dmg` |
            | **Linux** | `CBT-Teladan-x.x.x-linux.AppImage` atau `.deb` |

            ### Cara Install
            - **Windows**: Jalankan file `.exe`, installer akan berjalan otomatis
            - **macOS**: Buka file `.dmg`, drag aplikasi ke folder Applications
            - **Linux (AppImage)**: `chmod +x *.AppImage` lalu jalankan
            - **Linux (deb)**: `sudo dpkg -i *.deb`
          draft: false
          prerelease: false
          files: |
            artifacts/CBT-Teladan-Windows/*
            artifacts/CBT-Teladan-macOS/*
            artifacts/CBT-Teladan-Linux/*
